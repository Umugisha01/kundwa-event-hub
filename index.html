<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060b13" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#f1f5f9" />
  <!-- TODO: Set the document title to the name of your application -->
  <title>Kundwa IB Group — Africa's Premier Event Production</title>
  <meta name="description"
    content="Professional event production, management, and equipment rental in Africa. Sound, lighting, stage design & ticketing." />
  <meta name="author" content="Kundwa IB Group" />
  <meta property="og:title" content="Kundwa IB Group — Event Production & Management" />
  <meta property="og:description"
    content="Africa's premier event company. Book services, rent equipment, buy tickets." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('kundwa-theme-v2') || localStorage.getItem('kundwa-theme') || 'light';
        var isDark = theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = 'hsl(220, 60%, 6%)';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = 'hsl(220, 20%, 96%)';
        }
      } catch (e) {}
    })();
  </script>
</head>

<body style="background-color: inherit;">
  <div id="root" style="min-height: 100vh; background-color: inherit;"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
